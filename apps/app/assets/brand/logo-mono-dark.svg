    <path d="M 256 90 
             C 230 40, 180 60, 160 110 
             C 175 115, 195 105, 210 120 
             C 195 130, 185 145, 195 160 
             C 215 150, 235 140, 256 160
             C 277 140, 297 150, 317 160
             C 327 145, 317 130, 302 120
             C 317 105, 337 115, 352 110
             C 332 60, 282 40, 256 90 Z" 
          stroke="none"/>
    <path d="M 256 75 C 246 75, 240 65, 246 55 C 254 45, 266 50, 270 60 C 278 60, 274 68, 266 70 Z" stroke="none"/>
    <polygon points="270,60 282,65 270,68" stroke="none"/>

    <!-- Torse -->
    <rect x="220" y="168" width="72" height="12" rx="4" fill="none" stroke-width="3"/>

    <!-- Left Horse -->
    <path d="M 195 240 
             C 180 200, 140 185, 120 215 
             C 105 238, 120 260, 130 270 
             C 110 290, 95 320, 115 365 
             C 125 350, 135 345, 145 355
             C 135 325, 145 300, 175 305
             C 180 325, 170 365, 160 385
             L 175 390
             C 190 360, 195 320, 195 285 Z" 
          stroke-width="2"/>

    <!-- Right Horse -->
    <path d="M 317 240 
             C 332 200, 372 185, 392 215 
             C 407 238, 392 260, 382 270 
             C 402 290, 417 320, 397 365 
             C 387 350, 377 345, 367 355
             C 377 325, 367 300, 337 305
             C 332 325, 342 365, 352 385
             L 337 390
             C 322 360, 317 320, 317 285 Z" 
          stroke-width="2"/>

    <!-- Shield Outline -->
    <path d="M 195 185 
             L 317 185 
             C 317 270, 305 330, 256 365 
             C 207 330, 195 270, 195 185 Z" 
          fill="none" stroke-width="6"/>

    <!-- Pall (Y River) -->
    <path d="M 195 195
             C 225 215, 235 240, 244 265
             L 244 355
             L 268 355
             L 268 265
             C 277 240, 287 215, 317 195
             L 305 188
             C 280 205, 265 228, 256 248
             C 247 228, 232 205, 207 188 Z"
          stroke="none"/>

    <!-- Ground & Motto -->
    <path d="M 120 425 L 155 410 Q 256 395 357 410 L 392 425 L 375 440 Q 256 422 137 440 Z" fill="none" stroke-width="3"/>
    <text x="256" y="423" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="11" 
          font-weight="800" 
          letter-spacing="1.5" 
          stroke="none"
          text-anchor="middle">
      UNITY AND FAITH, PEACE AND PROGRESS
    </text>
  </g>
</svg>
