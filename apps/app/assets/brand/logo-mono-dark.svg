<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Monochrome Dark Variant: Designed for Light Backgrounds -->
  <g fill="#1B1F24" stroke="#1B1F24">
