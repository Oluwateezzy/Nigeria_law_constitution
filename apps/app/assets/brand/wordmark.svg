<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 72" width="100%" height="100%">
  <defs>
    <linearGradient id="wmGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006B3F"/>
      <stop offset="100%" stop-color="#004D2C"/>
    </linearGradient>
    <linearGradient id="wmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C842"/>
      <stop offset="100%" stop-color="#D4A017"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem (Flag Shield + Y Pall) -->
  <g transform="translate(4, 6) scale(0.6)">
    <!-- Flag Shield -->
    <path d="M 10 10 L 90 10 C 90 60, 80 85, 50 100 C 20 85, 10 60, 10 10 Z" fill="#006B3F"/>
    <path d="M 36 10 L 64 10 C 64 60, 58 85, 50 98 C 42 85, 36 60, 36 10 Z" fill="#FFFFFF"/>
    <path d="M 10 10 L 90 10 C 90 60, 80 85, 50 100 C 20 85, 10 60, 10 10 Z" fill="none" stroke="url(#wmGold)" stroke-width="4"/>

    <!-- Y Pall (River Confluence) -->
    <path d="M 28 20 C 40 35, 45 45, 47 55 L 47 88 L 53 88 L 53 55 C 55 45, 60 35, 72 20 L 64 16 C 54 28, 51 36, 50 42 C 49 36, 46 28, 36 16 Z" fill="#1B1F24"/>

    <!-- Red Eagle Top -->
    <path d="M 50 2 C 42 -8, 28 0, 24 8 C 30 10, 36 8, 42 12 C 45 10, 48 4, 50 2 C 52 4, 55 10, 58 12 C 64 8, 70 10, 76 8 C 72 0, 58 -8, 50 2 Z" fill="#CF222E"/>
  </g>

  <!-- Text: WHAT DOES THE LAW SAY -->
  <g transform="translate(74, 0)">
    <text x="0" y="32" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" 
          font-size="16" 
          font-weight="800" 
          letter-spacing="0.5" 
          fill="#1B1F24">
      WHAT DOES
    </text>
    <text x="0" y="54" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" 
          font-size="20" 
          font-weight="900" 
          letter-spacing="1">
      <tspan fill="#006B3F">THE LAW</tspan>
      <tspan fill="#D4A017"> SAY</tspan>
    </text>
  </g>
</svg>
