<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="flagGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006B3F"/>
      <stop offset="100%" stop-color="#004D2C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C842"/>
      <stop offset="50%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B1F24"/>
      <stop offset="100%" stop-color="#0B0D0E"/>
    </linearGradient>
    <linearGradient id="eagleRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background: Nigerian National Flag Tricolour with subtle rounded container -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#FFFFFF"/>
  <path d="M 16 112 C 16 59 59 16 112 16 L 170 16 L 170 496 L 112 496 C 59 496 16 453 16 400 Z" fill="url(#flagGreen)"/>
  <rect x="170" y="16" width="172" height="480" fill="#FFFFFF"/>
  <path d="M 342 16 L 400 16 C 453 16 496 59 496 112 L 496 400 C 496 453 453 496 400 496 L 342 496 Z" fill="url(#flagGreen)"/>
  
  <!-- Outer Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>

  <!-- Brand Emblem Container -->
  <g filter="url(#shadow)">
    <!-- Red Eagle Crest -->
    <g id="eagle">
      <!-- Eagle Wings -->
      <path d="M 256 90 
               C 230 40, 180 60, 160 110 
               C 175 115, 195 105, 210 120 
               C 195 130, 185 145, 195 160 
               C 215 150, 235 140, 256 160
               C 277 140, 297 150, 317 160
               C 327 145, 317 130, 302 120
               C 317 105, 337 115, 352 110
               C 332 60, 282 40, 256 90 Z" 
            fill="url(#eagleRed)"/>
      <!-- Eagle Head & Beak -->
      <path d="M 256 75 C 246 75, 240 65, 246 55 C 254 45, 266 50, 270 60 C 278 60, 274 68, 266 70 Z" fill="url(#eagleRed)"/>
      <polygon points="270,60 282,65 270,68" fill="url(#goldGrad)"/>
    </g>

    <!-- Torse (Wreath) -->
    <g id="torse">
      <rect x="220" y="168" width="18" height="12" rx="4" fill="#006B3F"/>
      <rect x="238" y="168" width="18" height="12" rx="4" fill="#FFFFFF" stroke="#006B3F" stroke-width="1"/>
      <rect x="256" y="168" width="18" height="12" rx="4" fill="#006B3F"/>
      <rect x="274" y="168" width="18" height="12" rx="4" fill="#FFFFFF" stroke="#006B3F" stroke-width="1"/>
    </g>

    <!-- Two White Stallions (Supporters) -->
    <!-- Left Horse -->
    <g id="horse-left">
      <path d="M 195 240 
               C 180 200, 140 185, 120 215 
               C 105 238, 120 260, 130 270 
               C 110 290, 95 320, 115 365 
               C 125 350, 135 345, 145 355
               C 135 325, 145 300, 175 305
               C 180 325, 170 365, 160 385
               L 175 390
               C 190 360, 195 320, 195 285 Z" 
            fill="#FFFFFF" stroke="#D1D9E0" stroke-width="2"/>
      <!-- Horse Mane & Tail (Gold accents) -->
      <path d="M 150 195 C 135 180, 125 190, 115 205 C 125 210, 135 205, 140 215 Z" fill="url(#goldGrad)"/>
      <path d="M 100 320 C 80 340, 75 375, 95 395 C 95 375, 105 360, 115 350 Z" fill="#F0F3F6"/>
    </g>

    <!-- Right Horse -->
    <g id="horse-right">
      <path d="M 317 240 
               C 332 200, 372 185, 392 215 
               C 407 238, 392 260, 382 270 
               C 402 290, 417 320, 397 365 
               C 387 350, 377 345, 367 355
               C 377 325, 367 300, 337 305
               C 332 325, 342 365, 352 385
               L 337 390
               C 322 360, 317 320, 317 285 Z" 
            fill="#FFFFFF" stroke="#D1D9E0" stroke-width="2"/>
      <!-- Horse Mane & Tail (Gold accents) -->
      <path d="M 362 195 C 377 180, 387 190, 397 205 C 387 210, 377 205, 372 215 Z" fill="url(#goldGrad)"/>
      <path d="M 412 320 C 432 340, 437 375, 417 395 C 417 375, 407 360, 397 350 Z" fill="#F0F3F6"/>
    </g>

    <!-- Central Shield -->
    <g id="shield">
      <!-- Shield Base -->
      <path d="M 195 185 
               L 317 185 
               C 317 270, 305 330, 256 365 
               C 207 330, 195 270, 195 185 Z" 
            fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="5"/>

      <!-- Silver Wavy Pall (The Iconic "Y" River Confluence) -->
      <path d="M 195 195
               C 225 215, 235 240, 244 265
               L 244 355
               C 248 358, 252 360, 256 362
               C 260 360, 264 358, 268 355
               L 268 265
               C 277 240, 287 215, 317 195
               L 305 188
               C 280 205, 265 228, 256 248
               C 247 228, 232 205, 207 188 Z"
            fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    </g>

    <!-- Flora Ground (Costus Spectabilis) -->
    <g id="ground">
      <path d="M 140 390 Q 256 370 372 390 Q 256 420 140 390 Z" fill="#006B3F"/>
      <!-- Flowers -->
      <circle cx="180" cy="388" r="5" fill="url(#goldGrad)"/>
      <circle cx="215" cy="383" r="5" fill="url(#goldGrad)"/>
      <circle cx="256" cy="380" r="6" fill="url(#goldGrad)"/>
      <circle cx="297" cy="383" r="5" fill="url(#goldGrad)"/>
      <circle cx="332" cy="388" r="5" fill="url(#goldGrad)"/>
    </g>

    <!-- Motto Ribbon Banner -->
    <g id="motto-banner">
      <path d="M 120 425 
               L 155 410 
               Q 256 395 357 410 
               L 392 425 
               L 375 440 
               Q 256 422 137 440 Z" 
            fill="url(#goldGrad)" stroke="#B8860B" stroke-width="2"/>
      <!-- Motto Text -->
      <text x="256" y="423" 
            font-family="system-ui, -apple-system, sans-serif" 
            font-size="11" 
            font-weight="800" 
            letter-spacing="1.5" 
            fill="#1B1F24" 
            text-anchor="middle">
        UNITY AND FAITH, PEACE AND PROGRESS
      </text>
    </g>
  </g>
</svg>
