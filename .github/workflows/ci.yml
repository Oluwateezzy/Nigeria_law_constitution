name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check-corpus
      - run: pnpm scan-secrets
      - run: EXPO_PUBLIC_AI_DOUBLE=1 pnpm --filter @nigeria-law/app exec expo export --platform web
      - run: pnpm scan-client-bundle
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:web
